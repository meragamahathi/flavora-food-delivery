<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Delivery | Logged Out</title>

<link rel="stylesheet" href="css/logout.css">

</head>

<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<div class="container">

    <div class="logout-box">

        <div class="check-icon">
            <svg viewBox="0 0 52 52" width="56" height="56">
                <circle cx="26" cy="26" r="25" fill="none" stroke="#ff7a00" stroke-width="2"/>
                <path fill="none" stroke="#ff7a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14 27l7 7 17-17"/>
            </svg>
        </div>

        <div class="header">
            <h1>You've been logged out</h1>
        </div>

        <p class="logout-message">
            Thanks for using Flavora. Come back soon &mdash; something delicious is always waiting.
        </p>

        <a href="login.html" class="logout-btn">
            Log in again
        </a>

    </div>

</div>

</body>
</html>
