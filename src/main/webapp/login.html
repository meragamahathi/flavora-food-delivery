<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container">

    <div class="login-box">

        <h1>Log in</h1>

        <p class="subtitle">
            Welcome back! Login to continue ordering your favourite food.
        </p>

        <form action="LoginServlet" method="post">

            <input
            type="email"
            name="email"
            placeholder="Email"
            required><br><br>

            <input
            type="password"
            name="password"
            placeholder="Password"
            required><br><br>

            <button type="submit">

                Login

            </button>

        </form>

        <div class="signup-link">

            New to Flavora?

            <a href="signup.html">Create account</a>

        </div>

    </div>

</div>

</body>

</html>
